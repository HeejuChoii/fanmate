# FanMate Render Blueprint — 계속 켜져 있는 Node Web Service 하나 + 영구 디스크(/data).
# 서버리스가 아니어야 한다: Croche FileStorage는 저장 폴더 하나를 프로세스 하나가 소유해야 한다(CLAUDE.md 배포 주의).
# 디스크를 붙인 서비스는 인스턴스 1개로만 돈다(스케일 아웃 불가) — 그래서 폴더 소유자가 하나로 유지된다.
# 키 값은 여기 넣지 않는다: sync:false 항목은 Render 대시보드에서 직접 입력한다.
services:
  - type: web
    name: fanmate
    runtime: node
    region: singapore # 한국 관람객과 가장 가까운 Render 리전
    plan: starter # 영구 디스크는 유료 인스턴스에서만 붙는다(free 불가)
    buildCommand: npm ci
    startCommand: npm run start:prod
    healthCheckPath: /health
    disk:
      name: fanmate-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Croche Studio 키 — 값은 대시보드에서 입력 (레포·코드에 넣지 않음)
      - key: CROCHE_PROJECT_KEY
        sync: false
      - key: CROCHE_SERVER_KEY
        sync: false
      # Qloo hackathon API key — 대시보드에서 입력
      - key: QLOO_API_KEY
        sync: false
      # 익명 사용자 쿠키 서명용. Render가 무작위 값을 만들어 준다(재배포해도 유지)
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /data
      - key: BOOTH_IDLE_RESET
        value: "0" # 심사위원이 쓰는 중에 초기화되지 않게 끔
      # Render 프록시 뒤: X-Forwarded-For / X-Forwarded-Proto를 믿는다
      - key: TRUST_PROXY
        value: "1"
      # 비용 보호 (기본값과 같음 — 대시보드에서 바로 조정)
      - key: USER_MESSAGE_LIMIT
        value: "30"
      - key: GLOBAL_MESSAGES_PER_HOUR
        value: "600"
      - key: TOOL_CALLS_PER_TURN
        value: "12"
      - key: MAX_SESSIONS
        value: "50"
      - key: SESSION_IDLE_MINUTES
        value: "20"
      - key: NEW_USERS_PER_IP_PER_HOUR
        value: "100"
